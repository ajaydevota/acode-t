name: build-acode

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-acode
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout Acode (upstream, MIT)
        uses: actions/checkout@v4
        with:
          repository: Acode-Foundation/Acode
          submodules: recursive
          path: src

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install deps + cordova + setup platform
        working-directory: src
        run: |
          npm install --no-audit --no-fund
          npm install -g cordova
          npm run setup

      - name: Build debug APK
        working-directory: src
        run: |
          node utils/storage_manager.mjs y || true
          npm run build paid dev apk

      - name: Collect APK
        run: |
          ls -la src/platforms/android/app/build/outputs/apk/debug/
          mkdir -p out
          cp src/platforms/android/app/build/outputs/apk/debug/app-debug.apk out/acode-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acode-apk
          path: out/acode-debug.apk
          if-no-files-found: error
