name: build-acode-termux-fused

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: fused
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Checkout Acode (upstream, MIT)
        uses: actions/checkout@v4
        with:
          repository: Acode-Foundation/Acode
          submodules: recursive
          path: src

      - name: Checkout upstream termux-app (v0.118.0, unmodified)
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: v0.118.0
          path: termux

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Patch phase 1 (display name only)
        run: python3 patch.py src pre

      - name: Install deps + cordova + platform
        working-directory: src
        run: |
          npm install --no-audit --no-fund
          npm install -g cordova
          npm run setup

      - name: Fetch Termux bootstrap
        run: |
          curl -L --retry 3 -o bootstrap-arm64.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-2026.10.04-r1%2Bapt.android-7/bootstrap-aarch64.zip"
          ls -la bootstrap-arm64.zip

      - name: Install fuse into the Acode project + register hook
        run: |
          mkdir -p src/termux-fuse
          cp patch.py bootstrap-arm64.zip src/termux-fuse/
          cp -r overlay src/termux-fuse/overlay
          cp termux-fuse/hook.js src/termux-fuse/hook.js
          python3 - <<'PY'
          import re
          p = "src/config.xml"
          s = open(p, encoding="utf-8").read()
          if "termux-fuse/hook.js" not in s:
              hook = '        <hook type="after_prepare" src="termux-fuse/hook.js" />\n'
              i = s.rfind("</platform>")
              s = s[:i] + hook + s[i:]
              open(p, "w", encoding="utf-8").write(s)
              print("hook registered")
          else:
              print("hook already registered")
          PY

      - name: Dump termux client interface signatures (diagnostic)
        continue-on-error: true
        working-directory: src
        run: |
          set -x
          mkdir -p /tmp/aar && cd /tmp/aar
          for m in terminal-view terminal-emulator; do
            curl -sSL -o $m.aar "https://jitpack.io/com/termux/termux-app/$m/0.118.0/$m-0.118.0.aar" || true
            mkdir -p $m && (cd $m && unzip -o ../$m.aar classes.jar > /dev/null 2>&1 || true)
          done
          find /tmp/aar -name classes.jar | while read j; do
            echo "===== $j ====="
            unzip -o "$j" -d "${j%.jar}" > /dev/null 2>&1 || true
          done
          javap -classpath /tmp/aar/terminal-emulator/classes com.termux.terminal.TerminalSessionClient 2>&1 | head -40
          echo "-----------"
          javap -classpath /tmp/aar/terminal-view/classes:/tmp/aar/terminal-emulator/classes com.termux.view.TerminalViewClient 2>&1 | head -40

      - name: Build (config + rspack + cordova, hook applies the fuse)
        working-directory: src
        run: |
          node utils/storage_manager.mjs y || true
          node ./utils/config.js d paid
          npx rspack --mode development
          cordova build android -- --packageType=apk

      - name: Dump manifests (diagnostic)
        if: always()
        run: |
          echo "=========== SOURCE MANIFEST (after patch) ==========="
          grep -nE "activity|activity-alias|LAUNCHER|MAIN|TermuxActivity|MainActivity" \
            src/platforms/android/app/src/main/AndroidManifest.xml | head -60
          echo "=========== MERGED MANIFEST ==========="
          f=$(find src/platforms/android/app/build -path "*merged_manifest*" -name "AndroidManifest.xml" | head -1)
          echo "file: $f"
          [ -n "$f" ] && grep -nE "activity|LAUNCHER|<application" "$f" | head -60

      - name: Collect APK
        run: |
          ls -la src/platforms/android/app/build/outputs/apk/debug/
          mkdir -p out
          cp src/platforms/android/app/build/outputs/apk/debug/app-debug.apk out/termux-acode.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-acode-apk
          path: out/termux-acode.apk
          if-no-files-found: error
